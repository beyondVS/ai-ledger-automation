[project]
name = "ai-ledger-backend"
version = "1.26.0"
description = "AI-powered ledger automation backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.6,<6.1",
    "django-environ>=0.13.0",
    "django-filter>=24.3",
    "psycopg[binary]>=3.3.4",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.7.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "djangorestframework-simplejwt>=5.4.0",
    "pillow>=10.2.0",
    "google-genai>=1.0.0",
    "litellm>=1.88.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
    "psycopg-pool>=3.2.4",
    "pytesseract>=0.3.10",
    "pywebpush>=2.0.0",
    "py-vapid>=1.9.0",
    "httpx[http2]>=0.27.0",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = "src"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]


