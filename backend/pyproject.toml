[project]
name = "ai-ledger-backend"
version = "1.4.0"
description = "AI-powered ledger automation backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5",
    "django-environ>=0.13.0",
    "psycopg[binary]>=3.3.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = "src"
python_files = ["tests/unit/**/*.py", "tests/integration/**/*.py", "test_*.py"]
