[project]
name = "ai-ledger-backend"
version = "1.6.0"
description = "AI-powered ledger automation backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5",
    "django-environ>=0.13.0",
    "psycopg[binary]>=3.3.4",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.7.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "djangorestframework-simplejwt>=5.4.0",
    "pillow>=10.2.0",
    "google-genai>=1.0.0",
    "litellm>=1.88.0",
    "celery>=5.3.6",
    "redis>=5.0.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = "src"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "**/migrations/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module level import not at top of file
    "F403",  # Star imports (settings.py 상속용)
    "F405",  # Undefined from star import
    "E722",  # Bare except (레거시 코드 예외)
    "B017",  # pytest.raises(Exception) 사용 허용
]

[tool.ruff.lint.isort]
combine-as-imports = true
