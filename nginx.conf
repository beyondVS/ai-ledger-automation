server {
    listen 80;
    server_name localhost;

    # 대용량 영수증 업로드 처리를 위해 클라이언트 바디 버퍼 임계치 상향
    client_max_body_size 50M;

    # 외부 SSL 오프로딩(Cloudflare/ALB) 감지 및 강제 HTTPS 리다이렉션 (헌법 제V조 수호)
    # X-Forwarded-Proto 헤더가 https가 아닌 경우에만 리다이렉트
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Frontend SPA 정적 자산 직접 서빙
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Backend API 리버스 프록시 중계 (CORS-free 단일 도메인 라우팅)
    location /api/ {
        proxy_pass http://api-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
